services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unpublish-article-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    env_file:
      - .env
    environment:
      - PORT=5000
      - NODE_ENV=production
      - DATA_DIR=/app/data
      - EPRINTS_DOCUMENTS_PATH=/eprints/documents
    volumes:
      - app-db-data:/app/data
      - ./storage/documents:/eprints/documents
    networks:
      - ums-network
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/health').then(r => r.ok ? process.exit(0) : process.exit(1)).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 3s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: unpublish-article-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - ums-network

volumes:
  app-db-data:
    driver: local

networks:
  ums-network:
    driver: bridge
